{% extends "base.html" %}

{% block title %}
Rectangle Area
{% endblock %}

{% block content %}

<div class="content-card">

    <h1>AREA OF RECTANGLE</h1>

    <p class="system">System // Ready</p>

    <form action="/works/area/rectangle" method="post">

        <label for="length">Enter the length:</label>
        <br>
        <input type="text" id="length" name="length" autocomplete="off">
        <br>

        <label for="width">Enter the width:</label>
        <br>
        <input type="text" id="width" name="width" autocomplete="off">
        <br>
        <input type="submit" value="COMPUTE">

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if result is not none %}
        <p class="result">Area of the rectangle: {{ result|round(2) }}</p>
    {% endif %}

    <br>
    <a href="/works" class="work-button">← Back to Works</a>

</div>

{% endblock %}
