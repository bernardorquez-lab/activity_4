{% extends "base.html" %}

{% block title %}
Triangle Area
{% endblock %}

{% block content %}

<div class="content-card">

    <h1>AREA OF TRIANGLE</h1>

    <p class="system">System // Ready</p>

    <form action="/works/area/triangle" method="post">

        <label for="base">Enter the base:</label>
        <br>
        <input type="text" id="base" name="base" autocomplete="off">
        <br>

        <label for="height">Enter the height:</label>
        <br>
        <input type="text" id="height" name="height" autocomplete="off">
        <br>
        <input type="submit" value="COMPUTE">

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if result is not none %}
        <p class="result">Area of the triangle: {{ result|round(2) }}</p>
    {% endif %}

    <br>
    <a href="/works" class="work-button">← Back to Works</a>

</div>

{% endblock %}
