<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}CPE Website{% endblock %}</title>
    <script>document.documentElement.classList.add("js")</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- DIGITAL BACKGROUND -->
    <div class="background">

        <div class="glow glow1"></div>
        <div class="glow glow2"></div>

        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
        <div class="line line4"></div>
        <div class="line line5"></div>
        <div class="line line6"></div>

        <div class="node node1"></div>
        <div class="node node2"></div>
        <div class="node node3"></div>

        <div class="binary b1">01001001</div>
        <div class="binary b2">101101</div>
        <div class="binary b3">01101001</div>
        <div class="binary b4">110010</div>
        <div class="binary b5">01011010</div>
        <div class="binary b6">10101</div>
        <div class="binary b7">001101</div>
        <div class="binary b8">11010101</div>

    </div>

    <div id="spotlight"></div>

    <!-- MOUSE BINARY -->
    <div id="mouse-binary"></div>


    <!-- PAGE CONTENT -->
    <div class="page-content">

        <nav>
            <a href="/" {% if request.path == '/' %}class="active"{% endif %}>HOME</a>
            <a href="/profile" {% if request.path == '/profile' %}class="active"{% endif %}>PROFILE</a>
            <a href="/works" {% if request.path.startswith('/works') %}class="active"{% endif %}>WORKS</a>
            <a href="/contact" {% if request.path == '/contact' %}class="active"{% endif %}>CONTACT</a>
        </nav>

        {% block content %}
        {% endblock %}

        <footer>
            © 2026 Bernard Orquez &nbsp;|&nbsp; Built with Flask &nbsp;|&nbsp;
            <a href="https://github.com/bernardorquez-lab" target="_blank">GitHub</a>
        </footer>

    </div>


    <!-- JAVASCRIPT -->
    <script>
        document.addEventListener("mousemove", function(event) {

            const binary = document.createElement("span");

            if (Math.random() < 0.5) {
                binary.textContent = "0";
            } else {
                binary.textContent = "1";
            }

            binary.style.left = event.clientX + "px";
            binary.style.top = event.clientY + "px";

            document
                .getElementById("mouse-binary")
                .appendChild(binary);

            setTimeout(function() {
                binary.remove();
            }, 1000);

        });
    </script>

    <script>
        // Cursor spotlight
        document.addEventListener("mousemove", function(e) {
            document.documentElement.style.setProperty("--mx", e.clientX + "px");
            document.documentElement.style.setProperty("--my", e.clientY + "px");
        });

        // Scroll reveal
        const io = new IntersectionObserver(function(entries) {
            entries.forEach(function(en) {
                if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); }
            });
        }, { threshold: 0.12 });
        document.querySelectorAll(".reveal").forEach(function(el) { io.observe(el); });
    </script>

</body>
</html>
