{% extends "base.html" %}

{% block title %}
Contact
{% endblock %}

{% block content %}

<div class="content-card">

    <h1>CONTACT ME</h1>

    <p class="system">SYSTEM // ONLINE</p>

    <p>
        You can reach me through any of the following platforms.
    </p>

    <div class="contact-icons">

        <!-- GITHUB -->
        <a href="https://github.com/bernardorquez-lab" target="_blank">
            <img src="{{ url_for('static', filename='images/Github.png') }}"
                 alt="GitHub">
            <span>GitHub</span>
        </a>


        <!-- FACEBOOK -->
        <a href="https://www.facebook.com/bernard.orquez.5/" target="_blank">
            <img src="{{ url_for('static', filename='images/Facebook.png') }}"
                 alt="Facebook">
            <span>Facebook</span>
        </a>


        <!-- GMAIL -->
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=bernardorquez@gmail.com"
        target="_blank">
            <img src="{{ url_for('static', filename='images/Gmail.jpg') }}"
                alt="Gmail">
            <span>Gmail</span>
        </a>


        <!-- PHONE -->
        <a href="tel:+639997981098">
            <img src="{{ url_for('static', filename='images/Contact.jpg') }}"
                alt="Contact Number">

            <span>Contact Number</span>

            <small>+63 999 7981 098</small>
        </a>

    </div>

</div>

<style>

    .contact-icons {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-top: 35px;
        flex-wrap: wrap;
    }

    .contact-icons a {
        width: 130px;
        padding: 15px;

        text-align: center;
        text-decoration: none;

        color: cyan;

        background: rgba(0, 10, 20, 0.8);

        border: 1px solid rgba(0, 255, 255, 0.5);
        border-radius: 12px;

        transition: 0.3s;
    }

    .contact-icons a:hover {
        transform: translateY(-8px);

        border-color: cyan;

        box-shadow:
            0 0 10px cyan,
            0 0 25px rgba(0, 255, 255, 0.4);
    }

    .contact-icons img {
        width: 70px;
        height: 70px;

        object-fit: contain;

        display: block;
        margin: auto;
        margin-bottom: 10px;

        border-radius: 8px;
    }

    .contact-icons span {
        font-weight: bold;
        font-family: monospace;
    }

</style>

{% endblock %}
